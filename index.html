<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sri Veda Multi Specialty Hospital</title>
  
  <!-- Simple Stylesheet -->
  <link rel="stylesheet" href="style.css" />

  <!-- React 18 & Babel (CDN for easy running) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <!-- React Mount Point -->
  <div id="root">
    <p style="text-align: center; padding: 50px; font-family: Arial;">Loading Sri Veda Hospital Portal...</p>
  </div>

  <!-- React Application Code -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Hospital Departments
    const DEPARTMENTS = [
      {
        id: "cardiology",
        name: "Cardiology",
        icon: "❤️",
        doctor: "Dr. R. K. Varma",
        desc: "Heart checkups, ECG, blood pressure, and cardiac emergency care."
      },
      {
        id: "neurology",
        name: "Neurology",
        icon: "🧠",
        doctor: "Dr. Priya Sundaram",
        desc: "Brain, spine, migraine treatments, and neurological consultations."
      },
      {
        id: "orthopedics",
        name: "Orthopedics",
        icon: "🦴",
        doctor: "Dr. Arvind Swaminathan",
        desc: "Bone fractures, joint pain relief, and orthopedic surgery."
      },
      {
        id: "pediatrics",
        name: "Pediatrics",
        icon: "👶",
        doctor: "Dr. Sneha Reddy",
        desc: "Child healthcare, newborn care, and regular vaccinations."
      },
      {
        id: "general",
        name: "General Medicine",
        icon: "💊",
        doctor: "Dr. K. Venkatesh",
        desc: "Fever, diabetes, routine health checkups, and general consultations."
      }
    ];

    // Doctors List
    const DOCTORS = [
      {
        id: 1,
        name: "Dr. R. K. Varma",
        dept: "Cardiology",
        qualification: "MBBS, MD (Cardio)",
        experience: "15 Years",
        timings: "10:00 AM - 02:00 PM",
        fee: "₹600"
      },
      {
        id: 2,
        name: "Dr. Priya Sundaram",
        dept: "Neurology",
        qualification: "MBBS, MS (Neuro)",
        experience: "12 Years",
        timings: "11:00 AM - 03:00 PM",
        fee: "₹700"
      },
      {
        id: 3,
        name: "Dr. Arvind Swaminathan",
        dept: "Orthopedics",
        qualification: "MBBS, MS (Ortho)",
        experience: "14 Years",
        timings: "09:30 AM - 01:30 PM",
        fee: "₹500"
      },
      {
        id: 4,
        name: "Dr. Sneha Reddy",
        dept: "Pediatrics",
        qualification: "MBBS, DCH (Pediatrics)",
        experience: "10 Years",
        timings: "10:00 AM - 04:00 PM",
        fee: "₹500"
      },
      {
        id: 5,
        name: "Dr. K. Venkatesh",
        dept: "General Medicine",
        qualification: "MBBS, MD (Gen Med)",
        experience: "18 Years",
        timings: "09:00 AM - 06:00 PM",
        fee: "₹400"
      }
    ];

    // Main App Component
    function App() {
      // Active page: 'home', 'departments', 'doctors', 'book', 'appointments', 'contact'
      const [currentPage, setCurrentPage] = useState("home");

      // Booking Form State
      const [patientName, setPatientName] = useState("");
      const [phone, setPhone] = useState("");
      const [selectedDept, setSelectedDept] = useState("Cardiology");
      const [selectedDoctor, setSelectedDoctor] = useState("Dr. R. K. Varma");
      const [appointmentDate, setAppointmentDate] = useState("");
      const [timeSlot, setTimeSlot] = useState("10:00 AM");
      const [successMessage, setSuccessMessage] = useState("");

      // Saved Appointments in State and LocalStorage
      const [appointments, setAppointments] = useState(() => {
        const saved = localStorage.getItem("sri_veda_appointments");
        if (saved) {
          try {
            return JSON.parse(saved);
          } catch (e) {
            return [];
          }
        }
        return [
          {
            id: "SV-101",
            patientName: "Rahul Sharma",
            phone: "9876543210",
            department: "Cardiology",
            doctor: "Dr. R. K. Varma",
            date: "2026-11-25",
            time: "10:00 AM",
            status: "Confirmed"
          }
        ];
      });

      // Save to LocalStorage
      useEffect(() => {
        localStorage.setItem("sri_veda_appointments", JSON.stringify(appointments));
      }, [appointments]);

      // When Department changes in form, auto-select doctor
      const handleDepartmentChange = (deptName) => {
        setSelectedDept(deptName);
        const foundDoc = DOCTORS.find(d => d.dept === deptName);
        if (foundDoc) {
          setSelectedDoctor(foundDoc.name);
        }
      };

      // Quick book jump
      const handleQuickBook = (deptName, docName) => {
        if (deptName) setSelectedDept(deptName);
        if (docName) setSelectedDoctor(docName);
        setCurrentPage("book");
        window.scrollTo(0, 0);
      };

      // Submit Form
      const handleBookSubmit = (e) => {
        e.preventDefault();

        if (!patientName || !phone || !appointmentDate) {
          alert("Please fill in your name, mobile number, and preferred date.");
          return;
        }

        const newAppointment = {
          id: "SV-" + Math.floor(100 + Math.random() * 900),
          patientName: patientName,
          phone: phone,
          department: selectedDept,
          doctor: selectedDoctor,
          date: appointmentDate,
          time: timeSlot,
          status: "Confirmed"
        };

        setAppointments([newAppointment, ...appointments]);
        setSuccessMessage(`Appointment successfully booked! Token ID: ${newAppointment.id}`);

        // Reset inputs
        setPatientName("");
        setPhone("");
        setAppointmentDate("");
      };

      // Cancel Appointment
      const handleCancelAppointment = (id) => {
        if (confirm("Are you sure you want to cancel this appointment?")) {
          const updated = appointments.map(item => {
            if (item.id === id) {
              return { ...item, status: "Cancelled" };
            }
            return item;
          });
          setAppointments(updated);
        }
      };

      return (
        <div>
          {/* Top Bar (No specific city location) */}
          <div className="top-bar">
            <div>
              <span>🚨 24x7 Emergency Care</span>
              <span>📞 Helpline: <strong>+91 98765 43210</strong> / <strong>108</strong></span>
            </div>
            <div>
              <span>✉️ info@srivedahospital.com</span>
            </div>
          </div>

          {/* Navigation Bar */}
          <header className="navbar">
            <div className="logo" onClick={() => setCurrentPage("home")}>
              Sri Veda
              <span>Multi Specialty Hospital</span>
            </div>

            <nav>
              <ul className="nav-menu">
                <li>
                  <button 
                    className={`nav-link ${currentPage === "home" ? "active" : ""}`}
                    onClick={() => setCurrentPage("home")}
                  >
                    Home
                  </button>
                </li>
                <li>
                  <button 
                    className={`nav-link ${currentPage === "departments" ? "active" : ""}`}
                    onClick={() => setCurrentPage("departments")}
                  >
                    Departments
                  </button>
                </li>
                <li>
                  <button 
                    className={`nav-link ${currentPage === "doctors" ? "active" : ""}`}
                    onClick={() => setCurrentPage("doctors")}
                  >
                    Doctors
                  </button>
                </li>
                <li>
                  <button 
                    className={`nav-link ${currentPage === "book" ? "active" : ""}`}
                    onClick={() => { setSuccessMessage(""); setCurrentPage("book"); }}
                  >
                    Book Appointment
                  </button>
                </li>
                <li>
                  <button 
                    className={`nav-link ${currentPage === "appointments" ? "active" : ""}`}
                    onClick={() => setCurrentPage("appointments")}
                  >
                    My Bookings ({appointments.length})
                  </button>
                </li>
                <li>
                  <button 
                    className={`nav-link ${currentPage === "contact" ? "active" : ""}`}
                    onClick={() => setCurrentPage("contact")}
                  >
                    Contact Us
                  </button>
                </li>
                <li>
                  <button 
                    className="nav-link nav-btn-book"
                    onClick={() => { setSuccessMessage(""); setCurrentPage("book"); }}
                  >
                    + Book Now
                  </button>
                </li>
              </ul>
            </nav>
          </header>

          {/* Main Content Area */}
          <div className="container">

            {/* HOME VIEW */}
            {currentPage === "home" && (
              <div>
                <div className="hero">
                  <h1>Welcome to Sri Veda Multi Specialty Hospital</h1>
                  <p>
                    Providing quality and compassionate healthcare with experienced doctors, 
                    modern medical facilities, and 24-hour emergency services for your family.
                  </p>
                  <div>
                    <button className="btn-primary" onClick={() => setCurrentPage("book")}>
                      Book an Appointment
                    </button>
                    <button className="btn-secondary" onClick={() => setCurrentPage("doctors")}>
                      Find a Doctor
                    </button>
                  </div>
                </div>

                {/* Simple Stats */}
                <div className="stats-row">
                  <div className="stat-item">
                    <h3>24/7</h3>
                    <p>Emergency Services</p>
                  </div>
                  <div className="stat-item">
                    <h3>25+</h3>
                    <p>Specialist Doctors</p>
                  </div>
                  <div className="stat-item">
                    <h3>100+</h3>
                    <p>Hospital Beds</p>
                  </div>
                  <div className="stat-item">
                    <h3>15,000+</h3>
                    <p>Happy Patients</p>
                  </div>
                </div>

                {/* Specialties Preview */}
                <div className="section">
                  <h2 className="section-title">Our Medical Specialties</h2>
                  <p className="section-subtitle">Dedicated departments equipped to treat a wide range of health conditions.</p>

                  <div className="cards-grid">
                    {DEPARTMENTS.slice(0, 3).map(dept => (
                      <div key={dept.id} className="card">
                        <div className="card-icon">{dept.icon}</div>
                        <h3>{dept.name}</h3>
                        <p>{dept.desc}</p>
                        <span className="card-tag">Specialist: {dept.doctor}</span>
                        <button 
                          className="card-btn"
                          onClick={() => handleQuickBook(dept.name, dept.doctor)}
                        >
                          Book Specialist &rarr;
                        </button>
                      </div>
                    ))}
                  </div>

                  <div style={{ textAlign: "center", marginTop: "25px" }}>
                    <button className="btn-secondary" onClick={() => setCurrentPage("departments")}>
                      View All Departments &rarr;
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* DEPARTMENTS VIEW */}
            {currentPage === "departments" && (
              <div className="section">
                <h2 className="section-title">Medical Specialties & Departments</h2>
                <p className="section-subtitle">Browse our clinical departments and consult with our specialists.</p>

                <div className="cards-grid">
                  {DEPARTMENTS.map(dept => (
                    <div key={dept.id} className="card">
                      <div className="card-icon">{dept.icon}</div>
                      <h3>{dept.name}</h3>
                      <p>{dept.desc}</p>
                      <span className="card-tag">Chief Doctor: {dept.doctor}</span>
                      <button 
                        className="card-btn"
                        onClick={() => handleQuickBook(dept.name, dept.doctor)}
                      >
                        Book Appointment &rarr;
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* DOCTORS VIEW */}
            {currentPage === "doctors" && (
              <div className="section">
                <h2 className="section-title">Our Specialist Doctors</h2>
                <p className="section-subtitle">Experienced doctors available for consultation.</p>

                <div className="cards-grid">
                  {DOCTORS.map(doc => (
                    <div key={doc.id} className="card">
                      <div className="card-icon">👨‍⚕️</div>
                      <h3>{doc.name}</h3>
                      <span className="card-tag">{doc.dept}</span>
                      <p>
                        <strong>Qualification:</strong> {doc.qualification}<br/>
                        <strong>Experience:</strong> {doc.experience}<br/>
                        <strong>OPD Timings:</strong> {doc.timings}<br/>
                        <strong>Consultation Fee:</strong> {doc.fee}
                      </p>
                      <button 
                        className="card-btn"
                        onClick={() => handleQuickBook(doc.dept, doc.name)}
                      >
                        Book with {doc.name.split(" ")[1]}
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* BOOK APPOINTMENT VIEW */}
            {currentPage === "book" && (
              <div className="section">
                <h2 className="section-title">Book an Appointment</h2>
                <p className="section-subtitle">Fill in the simple form below to schedule your doctor visit.</p>

                <div className="form-box">
                  {successMessage && (
                    <div className="alert-success">
                      <strong>✅ Success!</strong> {successMessage}
                      <div style={{ marginTop: "10px" }}>
                        <button 
                          className="btn-primary" 
                          style={{ padding: "6px 12px", fontSize: "14px" }}
                          onClick={() => setCurrentPage("appointments")}
                        >
                          View in My Bookings
                        </button>
                      </div>
                    </div>
                  )}

                  <form onSubmit={handleBookSubmit}>
                    <div className="form-group">
                      <label>Patient Full Name *</label>
                      <input 
                        type="text" 
                        placeholder="Enter patient name" 
                        required 
                        value={patientName}
                        onChange={(e) => setPatientName(e.target.value)}
                      />
                    </div>

                    <div className="form-group">
                      <label>Mobile Number *</label>
                      <input 
                        type="tel" 
                        placeholder="Enter 10-digit mobile number" 
                        required 
                        value={phone}
                        onChange={(e) => setPhone(e.target.value)}
                      />
                    </div>

                    <div className="form-group">
                      <label>Department</label>
                      <select 
                        value={selectedDept}
                        onChange={(e) => handleDepartmentChange(e.target.value)}
                      >
                        {DEPARTMENTS.map(d => (
                          <option key={d.id} value={d.name}>{d.name}</option>
                        ))}
                      </select>
                    </div>

                    <div className="form-group">
                      <label>Doctor</label>
                      <select 
                        value={selectedDoctor}
                        onChange={(e) => setSelectedDoctor(e.target.value)}
                      >
                        {DOCTORS.map(d => (
                          <option key={d.id} value={d.name}>{d.name} ({d.dept})</option>
                        ))}
                      </select>
                    </div>

                    <div className="form-group">
                      <label>Preferred Date *</label>
                      <input 
                        type="date" 
                        required 
                        value={appointmentDate}
                        min={new Date().toISOString().split("T")[0]}
                        onChange={(e) => setAppointmentDate(e.target.value)}
                      />
                    </div>

                    <div className="form-group">
                      <label>Preferred Time Slot</label>
                      <select 
                        value={timeSlot}
                        onChange={(e) => setTimeSlot(e.target.value)}
                      >
                        <option value="10:00 AM">Morning - 10:00 AM</option>
                        <option value="11:30 AM">Morning - 11:30 AM</option>
                        <option value="02:00 PM">Afternoon - 02:00 PM</option>
                        <option value="04:30 PM">Evening - 04:30 PM</option>
                        <option value="06:00 PM">Evening - 06:00 PM</option>
                      </select>
                    </div>

                    <button type="submit" className="btn-primary" style={{ width: "100%", marginTop: "10px" }}>
                      Confirm Appointment
                    </button>
                  </form>
                </div>
              </div>
            )}

            {/* MY BOOKINGS VIEW */}
            {currentPage === "appointments" && (
              <div className="section">
                <h2 className="section-title">My Booked Appointments</h2>
                <p className="section-subtitle">Track and manage your scheduled hospital consultations.</p>

                <div className="table-box">
                  {appointments.length === 0 ? (
                    <p style={{ textAlign: "center", color: "#666", padding: "20px" }}>
                      No appointments booked yet. Click on <strong>Book Appointment</strong> to schedule one.
                    </p>
                  ) : (
                    <table>
                      <thead>
                        <tr>
                          <th>Token ID</th>
                          <th>Patient Name</th>
                          <th>Department</th>
                          <th>Doctor</th>
                          <th>Date & Time</th>
                          <th>Status</th>
                          <th>Action</th>
                        </tr>
                      </thead>
                      <tbody>
                        {appointments.map(item => (
                          <tr key={item.id}>
                            <td><strong>{item.id}</strong></td>
                            <td>{item.patientName}</td>
                            <td>{item.department}</td>
                            <td>{item.doctor}</td>
                            <td>{item.date} at {item.time}</td>
                            <td>
                              <span className={item.status === "Confirmed" ? "badge-confirmed" : "badge-cancelled"}>
                                {item.status}
                              </span>
                            </td>
                            <td>
                              {item.status === "Confirmed" && (
                                <button 
                                  className="btn-cancel"
                                  onClick={() => handleCancelAppointment(item.id)}
                                >
                                  Cancel
                                </button>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>
              </div>
            )}

            {/* CONTACT VIEW (No specific city name) */}
            {currentPage === "contact" && (
              <div className="section">
                <h2 className="section-title">Contact & Hospital Information</h2>
                <p className="section-subtitle">Get in touch with us for medical inquiries or emergency assistance.</p>

                <div className="contact-box">
                  <div className="contact-item">
                    <strong>🏥 Hospital Address</strong>
                    Sri Veda Multi Specialty Hospital Campus, Main Medical Center, Opp. Central Park
                  </div>

                  <div className="contact-item">
                    <strong>📞 Emergency & Ambulance (24x7)</strong>
                    +91 98765 43210 / 108
                  </div>

                  <div className="contact-item">
                    <strong>☎️ General Hospital Reception</strong>
                    +91 98765 43200
                  </div>

                  <div className="contact-item">
                    <strong>✉️ Email Address</strong>
                    info@srivedahospital.com / appointments@srivedahospital.com
                  </div>

                  <div className="contact-item">
                    <strong>⏰ OPD Consulting Hours</strong>
                    Monday to Saturday: 08:00 AM - 08:00 PM (Emergency open 24 Hours)
                  </div>
                </div>
              </div>
            )}

          </div>

          {/* Simple Footer */}
          <footer className="footer">
            <p><strong>Sri Veda Multi Specialty Hospital</strong></p>
            <p>Compassionate Healthcare & Clinical Excellence</p>
            <p style={{ color: "#90a4ae", fontSize: "13px" }}>
              © 2026 Sri Veda Multi Specialty Hospital. All Rights Reserved.
            </p>
          </footer>
        </div>
      );
    }

    // Mount to DOM
    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
